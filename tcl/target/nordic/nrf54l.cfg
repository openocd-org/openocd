#
# Nordic nRF54L series
#
# Arm Cortex-M33 processor with RISC-V coprocessor
#
# The device uses resistive RAM (RRAM) as non-volatile memory.
#

if { [info exists CHIPNAME] } {
	set _CHIPNAME $CHIPNAME
} else {
	set _CHIPNAME nrf54l
}

# Work-area is a space in RAM used for flash programming, by default use 16 KiB.
if { [info exists WORKAREASIZE] } {
   set _WORKAREASIZE $WORKAREASIZE
} else {
   set _WORKAREASIZE 0x4000
}

if { [info exists CPUTAPID] } {
	set _CPUTAPID $CPUTAPID
} else {
	set _CPUTAPID 0x6ba02477
}

# Multidrop instance ID should be configurable by FW in TAD TINSTANCE register.
# Writes to the register are ignored due to a silicon erratum.
if { [info exists SWD_INSTANCE_ID] } {
	set _SWD_INSTANCE_ID $SWD_INSTANCE_ID
} else {
	set _SWD_INSTANCE_ID 0
}

transport select swd

swd newdap $_CHIPNAME cpu -expected-id $_CPUTAPID

if { [info exists SWD_MULTIDROP] } {
	dap create $_CHIPNAME.dap -tap $_CHIPNAME.cpu -dp-id 0x001c0289 -instance-id $_SWD_INSTANCE_ID
} else {
	dap create $_CHIPNAME.dap -tap $_CHIPNAME.cpu
}

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap -ap-num 0

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

# Create target for the AUX access port (AUX-AP).
target create $_CHIPNAME.aux mem_ap -dap $_CHIPNAME.dap -ap-num 1

# AUX-AP is accessible only if CSW Prot[0] bit (Data Access) is set
$_CHIPNAME.dap apsel 1
$_CHIPNAME.dap apcsw 0x01000000 0x01000000

adapter speed 1000

# Use main processor as default target.
targets $_TARGETNAME

if { [using_hla] } {
	echo ""
	echo "nRF device has a CTRL-AP dedicated to recover the device from AP lock"
	echo "A high level adapter you are currently using cannot access"
	echo "the CTRL-AP so 'nrf54l_recover' command will not work"
	echo "Do not enable UICR APPROTECT"
	echo ""
} else {

	# Test if debug/MEM-AP is locked by UICR APPROTECT
	proc nrf54l_check_ap_lock { } {

		set target [target current]

		set dap [$target cget -dap]
		set err [catch {set APPROTECTSTATUS [$dap apreg 2 0x14]}]
		# Check for APPROTECT (bit 0) and secure APPROTECT (bit 1).
		if {$err == 0 && ($APPROTECTSTATUS & 0x3) != 0} {
			echo "Warn :"
			echo "Warn : ****** WARNING ******"
			echo "Warn : \[$target\] has AP lock engaged (see UICR APPROTECT register)"
			echo "Warn : Debug access is denied"
			echo "Warn : Use 'nrf54l_recover' to erase and unlock the device"
			echo "Warn : "
			poll off
			return 1
		}
		return 0
	}

	# Mass erase and unlock the device using proprietary nRF CTRL-AP
	proc nrf54l_recover { } {

		set target [target current]
		set dap [$target cget -dap]

		set IDR [$dap apreg 2 0xfc]
		if {$IDR != 0x32880000} {
			echo "Error: Cannot access \[$target\] CTRL-AP"
			return
		}

		poll off

		# Trigger erase-all operation
		$dap apreg 2 4 1

		for {set i 0} {1} {incr i} {
			set ERASEALLSTATUS [$dap apreg 2 0x8]
			if {$ERASEALLSTATUS == 1} {
				echo "Info : \[$target\] is erased. Resetting to unlock"
				break
			}
			if {$i == 0} {
				echo "Info : Waiting up to 5 seconds for $target to be erased ..."
			}
			if {$i >= 50} {
				echo "Error: \[$target\] recovery failed"
				break
			}
			sleep 100
		}

		# Assert reset
		$dap apreg 2 0 2

		# Deassert reset
		$dap apreg 2 0 0

		sleep 100
		$target arp_examine
		poll on
	}
	add_help_text nrf54l_recover "Mass erase all device RRAM and unlock nRF54L"

	$_TARGETNAME cortex_m reset_config sysresetreq
	$_TARGETNAME configure -event examine-fail nrf54l_check_ap_lock

}

flash bank $_CHIPNAME.flash nrf54 0x00000000 0 0 0 $_TARGETNAME

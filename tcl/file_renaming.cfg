# This file is used to remap configuration files that has been
# renamed, except simple renames that are taken care automatically
# like:
#   .../file.cfg          ==>   .../${vendor}/file.cfg
#   .../vendor-file.cfg   ==>   .../vendor/file.cfg
#   .../vendor_file.cfg   ==>   .../vendor/file.cfg
#
# The formatting below is a TCL dict, so pairs of key-value
# in a simple TCL list, using for each line
#   old_name   new_name
# including in each name one of the prefix folder between
# board, chip, cpld, cpu, fpga, interface, target, test, tools

set _file_renaming {
	board/arty_s7.cfg			board/digilent/arty-s7.cfg
	board/digilent_analog_discovery.cfg	board/digilent/analog-discovery.cfg
	board/digilent_cmod_s7.cfg		board/digilent/cmod-s7.cfg
	board/digilent_nexys2.cfg		board/digilent/nexys-2.cfg
	board/digilent_nexys_video.cfg		board/digilent/nexys-video.cfg
	board/iar_lpc1768.cfg			board/olimex/lpc1768-stk.cfg
	board/olimex_lpc_h2148.cfg		board/olimex/lpc-h2148.cfg
	board/olimex_LPC2378STK.cfg		board/olimex/lpc2378-stk.cfg
	board/olimex_sam7_ex256.cfg		board/olimex/sam7-ex256.cfg
	board/olimex_sam7_la2.cfg		board/olimex/sam7-la2.cfg
	board/olimex_sam9_l9260.cfg		board/olimex/sam9-l9260.cfg
	board/olimex_stm32_h103.cfg		board/olimex/stm32-h103.cfg
	board/olimex_stm32_h107.cfg		board/olimex/stm32-h107.cfg
	board/olimex_stm32_h405.cfg		board/olimex/stm32-h405.cfg
	board/olimex_stm32_p107.cfg		board/olimex/stm32-p107.cfg
	board/omap2420_h4.cfg			board/ti/omap2420-h4.cfg
	board/stm32mp13x_dk.cfg			board/st/stm32mp135f-dk.cfg
	board/stm32mp15x_dk2.cfg		board/st/stm32mp157f-dk2.cfg
	board/st_nucleo_l5.cfg			board/st/nucleo-l552ze-q.cfg
	board/sifive-hifive1-revb.cfg		board/sifive/hifive1-rev-b.cfg
	board/ti_beagleboard.cfg		board/beagle/beagleboard.cfg
	board/ti_beagleboard_xm.cfg		board/beagle/beagleboard-xm.cfg
	board/ti_beaglebone-base.cfg	board/beagle/beaglebone-base.cfg
	board/ti_beaglebone_black.cfg	board/beagle/beaglebone-black.cfg
	board/ti_beaglebone.cfg			board/beagle/beaglebone.cfg
	cpld/xilinx-xc7.cfg			fpga/xlnx/xc7.cfg
	cpld/xilinx-xc7v.cfg			fpga/xlnx/xc7v.cfg
	cpld/xilinx-xc7vh580t.cfg		fpga/xlnx/xc7vh580t.cfg
	cpld/xilinx-xc7vh870t.cfg		fpga/xlnx/xc7vh870t.cfg
	interface/chameleon.cfg			interface/parport/chameleon.cfg
	interface/flashlink.cfg			interface/parport/flashlink.cfg
	target/zynq_7000.cfg			target/xlnx/zynq-7000.cfg
}
